<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Control de Garrafas</title>
    <link rel="stylesheet" href="/css/style.css">
    <script type="speculationrules">
    {
      "prerender": [
        {
          "source": "list",
          "urls": [
            "/pedidos.html",
            "/clientes.html",
            "/ventas.html",
            "/stock.html",
            "/diario.html"
          ],
          "eagerness": "conservative"
        }
      ]
    }
    </script>
</head>

<body>

    <main id="app-view">
        <!-- Panel superior de WhatsApp y Métricas -->
        <div class="panel-whatsapp">

            <!-- Bloque Izquierdo: WhatsApp y QR -->
            <div class="whatsapp-container">
                <div class="whatsapp-info">
                    <div class="whatsapp-header">
                        <span class="whatsapp-title">📱 WhatsApp</span>
                        <button class="btn-accion btn-eliminar btn-reiniciar-qr" onclick="reiniciarWhatsApp()">🔄 Reiniciar</button>
                    </div>
                    <p id="whatsapp-estado" class="whatsapp-status">Verificando estado...</p>
                    <small class="whatsapp-note">Sincronización automática activa.</small>
                </div>
                <!-- ID sagrado para el QR -->
                <div id="contenedor-qr" class="qr-box"></div>
            </div>

            <!-- Bloque Derecho: Métricas y Stock -->
            <div class="metrics-grid">
                <!-- Tarjeta Stock Detallado -->
                <div class="metric-card">
                    <span class="metric-label">Stock por Tipo</span>
                    <div id="resumen-stock-pedidos" class="metric-stock-text">Cargando...</div>
                </div>

                <!-- Tarjeta Vendidas Hoy -->
                <div class="metric-card metric-center">
                    <span class="metric-label">Vendidas (Hoy)</span>
                    <p id="resumen-garrafas-pedidos" class="metric-val text-blue">0 un.</p>
                </div>

                <!-- Tarjeta Cobrado Hoy -->
                <div class="metric-card metric-center">
                    <span class="metric-label">Cobrado (Hoy)</span>
                    <p id="resumen-cobrado-pedidos" class="metric-val text-green">$0</p>
                </div>

                <!-- Tarjeta Pendiente Hoy -->
                <div class="metric-card metric-center">
                    <span class="metric-label">Pendiente (Hoy)</span>
                    <p id="resumen-pendiente-pedidos" class="metric-val text-orange">$0</p>
                </div>
            </div>
        </div>

        <!-- Acciones Superiores y Filtros -->
        <div class="acciones-superiores-container">
            <div class="grupo-izquierdo">
                
                <button onclick="abrirModalCliente()" class="btn-nuevo-cliente">+ Nuevo Cliente</button>
                <button class="btn-nuevo" onclick="abrirModalPedido()">+ Nuevo Pedido</button>
                <button class="btn-principal btn-hoy" onclick="filtrarPedidosHoy()">📅 Pedidos de Hoy</button>

            </div>

            <div class="grupo-filtros">
                <div class="filtro-campo">
                    <label for="filtro-desde">Desde:</label>
                    <input type="date" id="filtro-desde" class="input-buscador" onchange="filtrarPedidosPorFecha()">
                </div>
                <div class="filtro-campo">
                    <label for="filtro-hasta">Hasta:</label>
                    <input type="date" id="filtro-hasta" class="input-buscador" onchange="filtrarPedidosPorFecha()">
                </div>
                <button class="btn-limpiar" onclick="limpiarFiltrosFecha()">Limpiar</button>
            </div>
        </div>

        <!-- Tabla de Pedidos -->
        <div class="table-responsive">
            <table class="tu-tabla-actual">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Tipo</th>
                        <th>Venta</th>
                        <th>Cantidad</th>
                        <th>Total</th>
                        <th>Pago</th>
                        <th>Fecha / Hora</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla-pedidos"></tbody>
            </table>
        </div>

        <!-- Modal de Pedido -->
        <div id="modal-pedido" class="modal-fondo" style="display: none;">
            <div class="modal-contenido">
                <span class="btn-cerrar" onclick="cerrarModalPedido()">&times;</span>
                <h2 id="titulo-modal-pedido">Nuevo Pedido</h2>
                <form id="form-pedido">
                    <input type="hidden" id="pedido-id">
                    <div class="grupo-form" id="grupo-cliente">
                        <label>Cliente:</label>
                        <select id="pedido-cliente" required></select>
                    </div>
                    <div class="grupo-form">
                        <label>Tipo de Garrafa:</label>
                        <select id="pedido-tipo" required>
                            <option value="10kg">Garrafa de 10kg</option>
                            <option value="15kg">Garrafa de 15kg</option>
                            <option value="30kg">Garrafa de 30kg</option>
                            <option value="45kg">Garrafa de 45kg</option>
                        </select>
                    </div>
                    <div class="grupo-form">
                        <label>Cantidad:</label>
                        <input type="number" id="pedido-cantidad" min="1" value="1" required>
                    </div>
                    <div class="grupo-form">
                        <label>Tipo de Venta / Canal:</label>
                        <select id="pedido-tipo-venta" required>
                            <option value="deposito">Depósito (Venta en la Oficina)</option>
                            <option value="reparto">Reparto (Envío a domicilio)</option>
                            <option value="comercios">Comercios</option>
                        </select>
                    </div>
                    <div class="grupo-form">
                        <label>Forma de Pago:</label>
                        <select id="pedido-forma-pago" required>
                            <option value="Efectivo">💵 Efectivo</option>
                            <option value="Mercado Pago">📱 Mercado Pago</option>
                            <option value="Transferencia">🏦 Transferencia</option>
                            <option value="Pendiente">⏳ Pendiente de Pago</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-guardar">Guardar</button>
                </form>
            </div>
        </div>
    </main>
     <!-- Única Ventana Flotante (Modal) para Nuevo/Editar Cliente -->
    <div id="modal-cliente" class="modal-fondo">
        <div class="modal-contenido">
            <span class="btn-cerrar" onclick="cerrarModalCliente()">&times;</span>
            <h2 id="titulo-modal-cliente">Registrar Nuevo Cliente</h2>
            <form id="form-cliente">
                <!-- Este campo oculto guarda el ID cuando editamos -->
                <input type="hidden" id="cliente-id">
                
                <div class="grupo-form">
                    <label>Nombre:</label>
                    <input type="text" id="cliente-nombre" required>
                </div>
                <div class="grupo-form">
                    <label>Teléfono:</label>
                    <input type="text" id="cliente-telefono" required>
                </div>
                <div class="grupo-form">
                    <label>Dirección:</label>
                    <input type="text" id="cliente-direccion">
                </div>
                <button type="submit" class="btn-guardar">Guardar Cliente</button>
            </form>
        </div>
    </div>
</body>
<script src="js/utils.js"></script>

<script src="js/header.js"></script>


<script src="js/pedidos.js"></script>
<script src="js/clientes.js"></script>

<script src="js/app.js"></script>
</html>
