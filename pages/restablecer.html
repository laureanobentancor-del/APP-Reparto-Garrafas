<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restablecer contraseña - Garrafas App</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f3f4f6;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
  .card{background:#fff;padding:28px;border-radius:12px;width:100%;max-width:380px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
  h2{margin-top:0}
  label{display:block;font-size:14px;margin:12px 0 4px}
  input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box}
  button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}
  button:disabled{opacity:.6}
  #msg{font-size:14px;min-height:20px;margin-top:10px;color:#dc2626}
  #msg.ok{color:#16a34a}
  ul{list-style:none;padding:0;margin:6px 0 0;font-size:13px}
</style>
</head>
<body>
<!-- No incluir header.js en esta página -->
<div class="card">
  <h2>Nueva contraseña</h2>
  <form id="form">
    <label for="nueva">Nueva contraseña</label>
    <input type="password" id="nueva" autocomplete="new-password" required>
    <ul id="req"></ul>
    <label for="confirmar">Repetir contraseña</label>
    <input type="password" id="confirmar" autocomplete="new-password" required>
    <p id="msg"></p>
    <button type="submit" id="btn">Guardar contraseña</button>
  </form>
</div>

<script>
const token = new URLSearchParams(location.search).get('token');
const msg = document.getElementById('msg');
const reglas = [
  ['Al menos 8 caracteres', p => p.length >= 8],
  ['Una mayúscula', p => /[A-Z]/.test(p)],
  ['Una minúscula', p => /[a-z]/.test(p)],
  ['Un número', p => /\d/.test(p)]
];
const pintar = () => {
  const v = document.getElementById('nueva').value;
  document.getElementById('req').innerHTML = reglas.map(([t, f]) =>
    `<li style="color:${f(v) ? '#16a34a' : '#6b7280'}">${f(v) ? '✔' : '○'} ${t}</li>`).join('');
};
document.getElementById('nueva').addEventListener('input', pintar);
pintar();

if (!token) { msg.textContent = 'Enlace inválido.'; document.getElementById('btn').disabled = true; }

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const nueva = document.getElementById('nueva').value;
  if (reglas.some(([, f]) => !f(nueva))) { msg.textContent = 'La contraseña no cumple los requisitos.'; return; }
  if (nueva !== document.getElementById('confirmar').value) { msg.textContent = 'Las contraseñas no coinciden.'; return; }

  const btn = document.getElementById('btn');
  btn.disabled = true; msg.className = ''; msg.textContent = '';
  try {
    const res = await fetch('/api/password/restablecer', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, nueva })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'No se pudo restablecer.');
    msg.className = 'ok'; msg.textContent = data.mensaje + ' Redirigiendo…';
    setTimeout(() => location.href = 'login.html', 2000);
  } catch (err) {
    msg.textContent = err.message; btn.disabled = false;
  }
});
</script>
</body>
</html>
