<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Reparto de Garrafas</title>
    <link rel="stylesheet" href="/css/style.css">

    <script type="speculationrules">
{
  "prerender": [
    {
      "source": "list",
      "urls": ["/pedidos.html", "/clientes.html", "/ventas.html", "/stock.html", "/diario.html"],
      "eagerness": "conservative"
    }
  ]
}
</script>
</head>
<body>

    <div class="login-card">
        <h2>Garrafas App</h2>
        <form id="form-login">
            <div class="form-group">
                <label>Usuario:</label>
                <input type="text" id="login-usuario" placeholder="Ej. admin" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" id="login-password" name="password" autocomplete="current-password" required style="width: 100%; padding: 8px;">
                <button type="submit" class="btn-principal">Ingresar</button>
        </form>
    </div>
  <script src="js/utils.js"></script>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>

</body>
</html>
