<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas - Control de Garrafas</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>        
        <!-- Acciones Superiores y Filtros -->
        <div class="acciones-superiores-container">
            <div class="grupo-filtros">
                <div class="filtro-campo">
                    <label for="buscador-ventas">Buscar:</label>
                    <input type="text" id="buscador-ventas" class="input-buscador" placeholder="Cliente o detalle...">
                </div>
            </div>
        </div>

    
<div class="ventas-resumen-card">
    <h3 class="ventas-titulo-verde">🗺️ Mapa de Concentración de Ventas - Nogoyá</h3>
    <div style="position: relative;">
        <div id="mapa-ventas" style="height: 450px; width: 100%; border-radius: 8px; z-index: 1;"></div>
        <button onclick="centrarMapaNogoya()" style="position: absolute; bottom: 15px; right: 15px; z-index: 1000; background: #2c3e50; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.3);">🎯 Centrar Mapa</button>
    </div>
</div>

<div class="ventas-resumen-card">
    <h3 class="ventas-titulo-verde">📊 Ranking de Zonas y Sectores (Nogoyá)</h3>
    <div id="panel-estadisticas-zonas" style="display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto;">
       
        <!-- Se rellena dinámicamente desde JavaScript -->


    </div>
</div>

        <div class="table-responsive">
    <table class="tabla-ventas">
        <thead>
    <tr>
        <th>ID</th>
        <th>Cliente</th>
        <th>Tipo</th>
        <th>Cantidad</th>
        <th>Total</th>
        <th>Forma de Pago</th>
        <th>Fecha / Hora</th>
        <th>Estado</th>
    </tr>
</thead>
        <tbody id="cuerpo-tabla-ventas"></tbody>
    </table>
</div>
    </main>
</body>
<script src="app.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="header.js"></script>
</html>
